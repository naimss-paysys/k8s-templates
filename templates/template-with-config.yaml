# ================================================================
# FILE: templates/template-with-config.yaml
# For Spring Boot services that have a configmap.yaml
# ================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: $SERVICE_NAME
  namespace: $NAMESPACE
  labels:
    app: $SERVICE_NAME
spec:
  replicas: $REPLICAS
  selector:
    matchLabels:
      app: $SERVICE_NAME
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # spin up 1 extra pod before killing any old one
      maxUnavailable: 0  # never reduce below desired count during rollout
  template:
    metadata:
      labels:
        app: $SERVICE_NAME
    spec:
      hostAliases:
        - ip: "$HOST_ALIAS_IP"
          hostnames:
            - "$AMBASSADOR_HOST"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - eksa01-dev-cluster-md-0-jgw6t-fqvnv
                      - eksa01-dev-cluster-md-0-jgw6t-z8sqz
      imagePullSecrets:
      - name: my-registry-secret
      initContainers:
        - name: trust-cert
          image: eclipse-temurin:17-jre
          command:
            - sh
            - -c
            - |

              echo "Copy default cacerts"
              cp $JAVA_HOME/lib/security/cacerts /work/cacerts
              echo "Import certificate"
              keytool -importcert \
                -alias mixxmmp \
                -file /certs/fullchain.crt \
                -keystore /work/cacerts \
                -storepass changeit \
                -noprompt

              echo "Cert trusted successfully"
              echo "Verifying cert"
              keytool -list -keystore /work/cacerts -storepass changeit | grep mixxmmp

          volumeMounts:
            - name: tls-cert
              mountPath: /certs
            - name: java-cacerts
              mountPath: /work
      containers:

      - name: $SERVICE_NAME
        image: MixxMMP-registry-test.tigo.co.tz/$IMAGE:$TAG
        ports:
        - containerPort: $PORT
        env:
        - name: SERVICE_NAME
          value: $SERVICE_NAME
        - name: APP_VERSION
          value: "$TAG"
        - name: CONTAINER_NAME
          value: $SERVICE_NAME
        - name: SPRING_CONFIG_LOCATION
          value: /app/config/application.yaml
        - name: LOGGING_CONFIG
          value: file:/app/config/logback.xml
        - name: JAVA_TOOL_OPTIONS
          value: "-Djavax.net.ssl.trustStore=/etc/ssl/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
        envFrom:
        - secretRef:
            name: dashboard-application-secrets
        resources:
          requests:
            cpu: $CPU_REQUEST
            memory: $MEMORY_REQUEST
          limits:
            cpu: $CPU_LIMIT
            memory: $MEMORY_LIMIT
        volumeMounts:
        - name: storage
          mountPath: /data/documents
        - name: java-cacerts
          mountPath: /etc/ssl
        - name: tls-cert
          mountPath: /certs
          readOnly: true
        - name: app-config
          mountPath: /app/config/application.yaml
          subPath: application.yaml
        - name: shared-logback
          mountPath: /app/config/logback.xml
          subPath: logback.xml
        - name: shared-logs
          mountPath: /logs

      - name: filebeat
        image: docker.elastic.co/beats/filebeat:8.13.4
        args: ["-c", "/etc/filebeat/filebeat.yml", "-e"]
        env:
        - name: ELK_USERNAME
          valueFrom:
            secretKeyRef:
              name: elk-credentials
              key: ELK_USERNAME
        - name: ELK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elk-credentials
              key: ELK_PASSWORD
        - name: SERVICE_NAME
          value: $SERVICE_NAME
        - name: APP_VERSION
          value: "$TAG"
        - name: CONTAINER_NAME
          value: $SERVICE_NAME
        - name: NAMESPACE
          value: $NAMESPACE
        - name: COUNTRY
          value: $COUNTRY
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: shared-filebeat-config
          mountPath: /etc/filebeat/filebeat.yml
          subPath: filebeat.yml
        - name: shared-logs
          mountPath: /logs
          readOnly: true
        - name: filebeat-registry
          mountPath: /usr/share/filebeat/data

      volumes:
      - name: storage
        persistentVolumeClaim:
            claimName: file-storage
      - name: java-cacerts
        emptyDir: {}
      - name: tls-cert
        secret:
          secretName: $TLS_SECRET
      - name: app-config
        configMap:
          name: $CONFIGMAP_FULL_NAME
      - name: shared-logback
        configMap:
          name: shared-logback
      - name: shared-filebeat-config
        configMap:
          name: shared-filebeat-config
      - name: shared-logs
        emptyDir: {}
      - name: filebeat-registry
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: $SERVICE_NAME-service
  namespace: $NAMESPACE
spec:
  selector:
    app: $SERVICE_NAME
  ports:
  - port: $PORT
    targetPort: $PORT
  type: ClusterIP

