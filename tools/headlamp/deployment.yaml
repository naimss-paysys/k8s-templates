# ================================================================
# Headlamp — Deployment + Service
# Namespace: test-mmp
# Accessible at: https://mixxmmp-test.tigo.co.tz/headlamp/
# ================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: test-mmp
  labels:
    app: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.26.0
          args:
            - -in-cluster
            - -base-url=/headlamp
          ports:
            - containerPort: 4466
          env:
            - name: HEADLAMP_FRONTEND_ONLY
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /headlamp/
              port: 4466
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /headlamp/
              port: 4466
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: test-mmp
  labels:
    app: headlamp
spec:
  selector:
    app: headlamp
  ports:
    - port: 4466
      targetPort: 4466
  type: ClusterIP
