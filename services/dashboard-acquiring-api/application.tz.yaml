# ========================================================================
# QR PAYMENT CONFIGURATION
# ========================================================================
qr:
  payment:
    # Telepin API Configuration
    telepin:
      endpoint: ${QR_PAYMENTS_URL:http://10.0.150.126:3011/TigoPaymentGateway_1_2}
      consumerId: mfs_app_new
      terminalType: USD
      shortCode: 50001  # Fixed short code for QR payments
      calculateFeeOperation: 1944  # Operation code for fee calculation
      paymentOperation: 1945  # Operation code for payment execution

    # Idempotency Configuration
    idempotency:
      ttlHours: 24  # Cache idempotency records for 24 hours

    # Retry Configuration
    retry:
      maxAttempts: 3  # Maximum retry attempts for SUBMITTED transactions
      intervalSeconds: 20  # Wait time between retry attempts
      timeoutSeconds: 30  # HTTP timeout for each inquiry attempt

    # Thread Pool Configuration for Async Processing
    async:
      corePoolSize: 5  # Minimum threads for async retry processing
      maxPoolSize: 10  # Maximum threads for async retry processing
      queueCapacity: 100  # Queue capacity for pending async tasks
      threadNamePrefix: "qr-payment-async-"
    image-size: 300
    mid-length: 15

