# ========================================================================
# NOTIFICATION SERVICE CONFIGURATION
# ========================================================================
notification:
  # SMS Channel Configuration (uses MPAY gateway)
  sms:
    enabled: ${NOTIFICATION_SMS_ENABLED:true}
    url: ${SMS_SERVICE_URL:http://43.225.98.87/MESSAGING/URL/MSGURL.ASPX}

  # Email Channel Configuration (uses MPAY gateway)
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
    url: ${EMAIL_SERVICE_URL:http://10.0.150.21:7034/api/EmailService}

  # Push Notification Channel (WebSocket/STOMP)
  push:
    enabled: ${NOTIFICATION_PUSH_ENABLED:true}

  # Queue Processor — DISABLED in acquiring-api (runs in job-processor only)
  queue:
    processor:
      enabled: false

  # Default locale for template resolution
  default-locale: ${NOTIFICATION_DEFAULT_LOCALE:en}

# Request body field decryption
decryption:
  enabled: false                 # set to true when acquiring-api clients send encrypted fields
  fields: sourcePIN,pin,password,oldPassword,newPassword,confirmPassword
  excluded-path-prefixes:       # path prefixes to skip decryption
  #  - /api/v1/public
  #  - /actuator


