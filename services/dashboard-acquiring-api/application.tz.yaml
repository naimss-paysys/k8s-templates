server:
  port: ${PORT:5503}
  max-http-request-header-size: 64KB
  servlet:
    session:
      timeout: 5000
      cookie:
        secure: true

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

swagger:
  enabled: true
file:
  upload:
    upload-dir: /data/documents/

# CORS Configuration
allowedHeaders: 'Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Allow-Origin,Access-Control-Allow-Credentials,X-API-Key'
allowedOrigins: '*'

# Application Configuration
application:
  name: acquiring-service
  description: Acquiring Service - External Internet-facing APIs
  version: 1.0.0

# JWT Configuration
jwt:
  expiration-ms: 86400000  # 24 hours

# Spring Configuration
spring:
  application:
    name: acquiring-service
#  main:
#    lazy-initialization: true
  # Redis Configuration for caching and rate limiting
  redis:
    host: ${REDIS_HOST:10.0.150.126}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  
  cache:
    type: redis
    redis:
      time-to-live: 86400000
      cache-null-values: false
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  thymeleaf:
    cache: false
  
  jmx:
    enabled: false
  
  # Database Configuration
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://10.0.150.11:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  
  # HikariCP Configuration
  hikari:
    pool-name: AcquiringServicePool
    maximum-pool-size: 10
    minimum-idle: 2
    idle-timeout: 900000
    connection-timeout: 30000
    max-lifetime: 1800000
    leak-detection-threshold: 120000
    validation-timeout: 5000
    auto-commit: true
  
  # JPA Configuration
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        id:
          new_generator_mappings: true

# Dashboard Configuration
dashboard:
  type: ACQUIRING_SERVICE
  api:
    key: ${API_KEY:acquiring-service-api-key}
    secret: ${API_SECRET:acquiring-service-api-secret}

# Pagination
page:
  size: 10

# Token Configuration
token:
  store:
    eviction: 280000
    type: redis

# Security Configuration
secret_key: "d4f12d6c8e9a9d0b"

security:
#  enabled: false
  login:
    max-failures: 5
    lock-duration-minutes: 1
  endpoints:
    public:
      - /api/v1/**      # ← makes ALL acquiring routes public
    protected:
      - /rest/**
#      - /api/v1/**
  auth:
#    type: oauth2-jwt   # uncomment to enable OAuth2 JWT authentication
    type: none
  oauth2:
    jwk-set-uri: ${OAUTH2_JWK_SET_URI:https://localhost:9443/oauth2/jwks}
    issuer-uri: ${OAUTH2_ISSUER_URI:https://localhost:9443/oauth2/token}

# Idempotency Configuration
idempotency:
  enabled: true
  ttl-hours: 24

# Rate Limiting Configuration
rate-limit:
  enabled: true
  max-requests: 100
  base-window-ms: 60000
  penalty-ms: 10000

# Actuator Endpoints
management:
  health:
    ldap:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    info:
      enabled: true

# Service Timeouts
acquiring-service:
  connect:
    timeout: 5000
  read:
    timeout: 5000

# Logging
logging:
  level:
    root: INFO
    com.paysyslabs.dashboard: INFO
    org.springframework.security: INFO


blacklistJwt.cache:
  name: blacklistJwtCache
  timeout: 36000000 # 10 hours = 10 * 60 * 60 * 1000

