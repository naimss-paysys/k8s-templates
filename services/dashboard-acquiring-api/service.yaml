# ── dashboard-acquiring-api ─────────────────────────────────────────
name: dashboard-acquiring-api
image: dashboard-acquiring-api
port: 5503
environment: test
config_version: v3


rollout_timeout: 60

resources:
  cpu: 200m/800m
  memory: 1024Mi/1536Mi

routing:
  prefix: /dashboard-acquiring-api/
  rewrite: /

scaling:
  min: 1
  max: 2
  cpu_threshold: 90
  mem_threshold: 75

secrets:
  - my-registry-secret
  - dashboard-application-secrets
  - elk-credentials
  - mixxmmp-tls-secret

countries:
  tz:
    namespace: test-mmp
    tag: 1.0.21-TZ
    replicas: 1
    ambassador_host: mixxmmp-test.tigo.co.tz
    host_alias_ip: 10.245.0.169
