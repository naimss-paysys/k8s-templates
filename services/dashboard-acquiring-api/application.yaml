server:
  port: ${PORT:5503}
  max-http-request-header-size: 64KB
  servlet:
    session:
      timeout: 5000
      cookie:
        secure: true

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

swagger:
  enabled: true

# CORS Configuration
allowedHeaders: 'Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Allow-Origin,Access-Control-Allow-Credentials,X-API-Key'
allowedOrigins: '*'

# Application Configuration
application:
  name: acquiring-service
  description: Acquiring Service - External Internet-facing APIs
  version: 1.0.0

# JWT Configuration
jwt:
  expiration-ms: 86400000  # 24 hours

# Spring Configuration
spring:
  application:
    name: acquiring-service
  
  # Redis Configuration for caching and rate limiting
  redis:
    host: ${REDIS_HOST:10.0.150.126}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  
  cache:
    type: redis
    redis:
      time-to-live: 86400000
      cache-null-values: false
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  thymeleaf:
    cache: false
  
  jmx:
    enabled: false
  
  # Database Configuration
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://10.0.150.11:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  
  # HikariCP Configuration
  hikari:
    pool-name: AcquiringServicePool
    maximum-pool-size: 10
    minimum-idle: 2
    idle-timeout: 900000
    connection-timeout: 30000
    max-lifetime: 1800000
    leak-detection-threshold: 120000
    validation-timeout: 5000
    auto-commit: true
  
  # JPA Configuration
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        id:
          new_generator_mappings: true

# Dashboard Configuration
dashboard:
  type: ACQUIRING_SERVICE
  api:
    key: ${API_KEY:acquiring-service-api-key}
    secret: ${API_SECRET:acquiring-service-api-secret}

# Pagination
page:
  size: 10

# Token Configuration
token:
  store:
    eviction: 280000
    type: redis

# Security Configuration
secret_key: "d4f12d6c8e9a9d0b"

security:
#  enabled: false
  login:
    max-failures: 5
    lock-duration-minutes: 1

# Rate Limiting Configuration
rate-limit:
  enabled: true
  max-requests: 100
  base-window-ms: 60000
  penalty-ms: 10000

# Actuator Endpoints
management:
  health:
    ldap:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    info:
      enabled: true

# Service Timeouts
acquiring-service:
  connect:
    timeout: 5000
  read:
    timeout: 5000

# ========================================================================
# BEST PRACTICES & RECOMMENDATIONS
# ========================================================================
# 
# 1. IDEMPOTENCY TTL:
#    - Production: 24-48 hours (balance between duplicate prevention and storage)
#    - High-volume: 12-24 hours (reduces database size)
#    - Low-volume: 48-72 hours (better customer support)
#
# 2. RETRY CONFIGURATION:
#    - maxAttempts: 3-5 attempts (more attempts = longer wait, fewer = faster failure)
#    - intervalSeconds: 15-30 seconds (Telepin processing time + network latency)
#    - Best practice: Exponential backoff (implement in AsyncRetryServiceImpl)
#      Example: 10s, 20s, 40s instead of fixed 20s intervals
#
# 3. TIMEOUT SETTINGS:
#    - Connection timeout: 10-15 seconds (network establishment)
#    - Read timeout: 30-60 seconds (Telepin processing time)
#    - Circuit breaker: Implement Resilience4j for Telepin failures
#
# 4. THREAD POOL SIZING:
#    - Core pool size = Number of expected concurrent SUBMITTED transactions
#    - Max pool size = 2x core size (handles traffic spikes)
#    - Queue capacity = 10x core size (prevents thread pool rejection)
#    - Monitor: ThreadPoolTaskExecutor metrics via Actuator
#
# 5. SECURITY:
#    - Telepin credentials: Store in environment variables (not in code)
#    - Callback authentication: Enable BEARER or API_KEY in production
#    - MSISDN masking: Mask customer MSISDN in logs (GDPR compliance)
#
# 6. MONITORING & ALERTING:
#    - Track retry success rate: Should be >95%
#    - Alert on high retry counts: >maxAttempts indicates Telepin issues
#    - Monitor idempotency cache hit rate: High rate = duplicate requests
#    - Dashboard metrics: Transaction status distribution (SUCCESS/FAILED/SUBMITTED)
#
# 7. DATABASE OPTIMIZATION:
#    - Create index on txn_transaction.transaction_status + retry_count
#    - Partition txn_idempotency_log by created_at (monthly partitions)
#    - Archive old callback_log records (>90 days) to cold storage
#
# 8. RATE LIMITING:
#    - Per merchant: 10 requests/minute (prevents abuse)
#    - Per customer MSISDN: 5 requests/minute (duplicate prevention)
#    - Global: 1000 requests/minute (infrastructure protection)
#
# 9. DISASTER RECOVERY:
#    - Implement manual retry endpoint for stuck SUBMITTED transactions
#    - Backup webhook: SMS fallback if Super App callback fails
#    - Transaction reconciliation: Daily batch job comparing MMP vs Telepin
#
# 10. PERFORMANCE TUNING:
#     - Enable Redis caching for merchant lookup (reduce DB load)
#     - Use PreparedStatement for transaction inserts (prevent SQL injection)
#     - Batch insert for callback_log (improve write performance)
# ========================================================================

