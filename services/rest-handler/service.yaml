# ── rest-handler ───────────────────────────────────────────────────
name: rest-handler
image: rest-handler
port: 8081
environment: test
config_version: v1
rollout_timeout: 60
# resources:              # default — overridden per country below
#   cpu: 200m/500m        # request/limit
#   memory: 256Mi/512Mi

# Remove block below if no autoscaling needed
#scaling:
#  min: 2
#  max: 6
#  cpu_threshold: 70
#  mem_threshold: 80

# Remove block below if no Ambassador routing needed
#routing:
#  prefix: /api/rest-handler/
#  rewrite: /
secrets:
  - my-registry-secret
  - dashboard-application-secrets
  - elk-credentials
  - mixxmmp-tls-secret
countries:
  tz:
    namespace: test-mmp
    tag: 1.0.4
    replicas: 1
    ambassador_host: mixxmmp-test.tigo.co.tz
    host_alias_ip: 10.245.0.169
    # resources:              # uncomment to override base resources
    #   cpu: 500m/1000m
    #   memory: 512Mi/1Gi

    configmap_full_name: rest-handler-config-tz-v1-1.0.4
