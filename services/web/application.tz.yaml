debug: false

logging:
  config: file:logback.xml

server:
  port: 7033

service:
  endpoint: acq
  secret: paysys@123

queue:
  config:
    host: mpay-rabbit.test-mmp.svc.cluster.local
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    heartbeat: 10
    retry:
      interval: 10
    rpc:
      queue: AXIAN-WS-IN
      timeout: 50000

spring:
  mandatoryFileEncoding: UTF-8

  http:
    encoding:
      charset: UTF-8
      enabled: true

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    sqlScriptEncoding: UTF-8
    tomcat:
      connection-properties: useUnicode=yes;characterEncoding=utf-8;

    hikari:
      connection-test-query: SELECT 1
      minimum-idle: 8
      maximum-pool-size: 24
      pool-name: sql-pool
      auto-commit: true
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    show-sql: true
    generate-ddl: false
    open-in-view: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        id.new_generator_mappings: false
