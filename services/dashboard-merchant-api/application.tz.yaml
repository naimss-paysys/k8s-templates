# ========================================================================
# NOTIFICATION SERVICE CONFIGURATION
# ========================================================================
notification:
  # SMS Channel
  sms:
    enabled: ${NOTIFICATION_SMS_ENABLED:true}
    url: ${SMS_SERVICE_URL:http://43.225.98.87/MESSAGING/URL/MSGURL.ASPX}

  # Email Channel
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
    url: ${EMAIL_SERVICE_URL:http://10.0.150.21:7034/api/EmailService}

  # Push Channel (WebSocket/STOMP) — merchant portal users real-time notifications
  push:
    enabled: ${NOTIFICATION_PUSH_ENABLED:true}
    # This module listens for merchant push notifications from Redis
    socket-listener: MERCHANT

  # Queue Processor — DISABLED in merchant-api (runs in job-processor only)
  queue:
    processor:
      enabled: false
    poll-interval-ms: ${NOTIFICATION_POLL_INTERVAL:5000}
    batch-size: ${NOTIFICATION_BATCH_SIZE:50}
    stuck-check-interval-ms: 120000

  retry:
    max-attempts: ${NOTIFICATION_MAX_RETRIES:3}
    base-delay-seconds: 30

  stuck-threshold-minutes: 5
  default-locale: ${NOTIFICATION_DEFAULT_LOCALE:en}

payment:
  cashout:
    shortcode: "50010"
  m2m:
    shortcode: "50001"
    terminalType: USD
    execute:
      service: "axian-send-money-staging"
    fee:
      service: "axian-mmp-fee-namecheck"

  fee-check:
    service: "axian-payments-fee-check"
  execute:
    service: "axian-payments"


external-api:

