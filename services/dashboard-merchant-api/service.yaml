# ── dashboard-merchant-api ──────────────────────────────────────────
name: dashboard-merchant-api
image: dashboard-merchant-api
port: 5502
environment: test
config_version: v3


rollout_timeout: 60

resources:
  cpu: 200m/500m
  memory: 1536Mi/2560Mi

routing:
  prefix: /dashboard-merchant-api/
  rewrite: /

scaling:
  min: 1
  max: 2
  cpu_threshold: 60
  mem_threshold: 75

secrets:
  - my-registry-secret
  - dashboard-application-secrets
  - elk-credentials
  - mixxmmp-tls-secret

countries:
  tz:
    namespace: test-mmp
    tag: 1.0.22-TZ
    replicas: 1
    ambassador_host: mixxmmp-test.tigo.co.tz
    host_alias_ip: 10.245.0.169
