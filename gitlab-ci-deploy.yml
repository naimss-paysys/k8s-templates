# ================================================================
# KubeForge Deploy Stage — drop into .gitlab-ci.yml
#
# HOW IT WORKS:
#   One pipeline job deploys ALL countries defined in each
#   service's service.yaml automatically — no COUNTRY variable needed.
#
# PREREQUISITE:
#   This file uses  extends: .common-rules  — you must define
#   .common-rules in your main .gitlab-ci.yml, for example:
#
#     .common-rules:
#       rules:
#         - if: '$CI_COMMIT_TAG'          # only on version tags
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   SSH_PRIVATE_KEY   — type: File  — private key for DEPLOY_HOST
#   DEPLOY_USER       — SSH user    (e.g. admin-dnf)
#   DEPLOY_HOST       — server IP / hostname
#   K8S_DIR           — absolute path on host  (e.g. /home/admin-dnf/k8s)
#   CI_RUNNER_TAG     — runner tag for deploy jobs
#   SERVICES          — space-separated: "dashboard-acquiring-api dashboard-backoffice"
#
# Optional CI/CD Variables:
#   APP_CONFIG_DIR    — used only for single-module projects (rest-handler, web,
#                       queue-handler).  Path to application.yaml in the repo.
#                       Default: repo root  (.)
#                       Example: "src/main/resources"
#
# APPLICATION CONFIG COPY LOGIC (per service):
#   Module project  (dashboard-application):
#     Looks for  <service-name>/application.yaml  in the repo.
#     e.g.  dashboard-backoffice/application.yaml
#     → copied to  services/dashboard-backoffice/application.<country>.yaml
#       for every country defined in service.yaml
#
#   Single project  (rest-handler, web, queue-handler):
#     Looks for  application.yaml  at  APP_CONFIG_DIR  (default: repo root).
#     → copied to  services/<service>/application.<country>.yaml
#
#   Frontend projects  (merchant-portal, backoffice-ui):
#     No application.yaml exists — copy step is skipped automatically.
# ================================================================

deploy:
  stage: deploy
  timeout: 20m
  tags:
    - ${CI_RUNNER_TAG}
  extends: .common-rules
  before_script:
    - chmod 600 "$SSH_PRIVATE_KEY"
    # Fail fast if required variables are missing
    - |
      for _v in CI_COMMIT_TAG DEPLOY_USER DEPLOY_HOST K8S_DIR SERVICES SSH_PRIVATE_KEY; do
        [ -n "${!_v}" ] || { echo "  ERROR: $_v is not set — add it to CI/CD Variables"; exit 1; }
      done
    # Verify SSH reachable before starting the loop
    - |
      ssh -i "$SSH_PRIVATE_KEY" \
          -o StrictHostKeyChecking=no \
          -o ConnectTimeout=10 \
          "$DEPLOY_USER@$DEPLOY_HOST" "echo '  SSH OK: $DEPLOY_HOST'" \
        || { echo "  ERROR: Cannot reach $DEPLOY_USER@$DEPLOY_HOST"; exit 1; }
  script:
    - |
      echo ""
      echo "  ┌────────────────────────────────────────────────────"
      echo "  │  KubeForge Pipeline Deploy"
      echo "  │  Tag      : $CI_COMMIT_TAG"
      echo "  │  Host     : $DEPLOY_USER@$DEPLOY_HOST"
      echo "  │  Services : $SERVICES"
      echo "  └────────────────────────────────────────────────────"
      echo ""

      FAILED=""

      for SERVICE in $SERVICES; do
        echo "  ▶  $SERVICE  →  $CI_COMMIT_TAG"

        # ── Validate service.yaml exists in repo checkout ────────────────
        [ -f "services/$SERVICE/service.yaml" ] || {
          echo "  ✖  FAILED: services/$SERVICE/service.yaml not found in repo"
          FAILED="$FAILED $SERVICE"
          continue
        }

        # ── Read countries defined in service.yaml ───────────────────────
        SERVICE_COUNTRIES=$(yq '.countries | keys | .[]' "services/$SERVICE/service.yaml" 2>/dev/null)
        if [ -z "$SERVICE_COUNTRIES" ]; then
          echo "  ✖  FAILED: no countries defined in services/$SERVICE/service.yaml"
          FAILED="$FAILED $SERVICE"
          continue
        fi

        # ── Detect application.yaml source (once per service) ────────────
        _app_src=""
        if [ -f "${SERVICE}/application.yaml" ]; then
          _app_src="${SERVICE}/application.yaml"
        elif [ -f "${APP_CONFIG_DIR:-.}/application.yaml" ]; then
          _app_src="${APP_CONFIG_DIR:-.}/application.yaml"
        fi

        # ── Copy application config for every country ────────────────────
        if [ -n "$_app_src" ]; then
          for _c in $SERVICE_COUNTRIES; do
            echo "  ↑  Syncing ${_app_src} → services/$SERVICE/application.${_c}.yaml"
            scp -i "$SSH_PRIVATE_KEY" \
                -o StrictHostKeyChecking=no \
                "$_app_src" \
                "$DEPLOY_USER@$DEPLOY_HOST:$K8S_DIR/services/$SERVICE/application.${_c}.yaml" \
              || {
                echo "  ✖  FAILED: could not sync application config for $SERVICE [$_c]"
                FAILED="$FAILED $SERVICE"
                continue 2
              }
            echo "  ✔  Config synced → application.${_c}.yaml"
          done
        else
          echo "  ⊘  No application.yaml found — skipping config sync for $SERVICE"
        fi

        # ── SSH: update tag in service.yaml, then deploy every country ───
        for COUNTRY in $SERVICE_COUNTRIES; do
          echo "  ▶  deploying $SERVICE [$COUNTRY]"
          set +e
          ssh -i "$SSH_PRIVATE_KEY" \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            cd \"$K8S_DIR\"

            # ── Validate service directory and country block ──────────
            [ -d services/$SERVICE ] || { echo '  ERROR: services/$SERVICE not found'; exit 1; }
            [ -f services/$SERVICE/service.yaml ] || { echo '  ERROR: service.yaml missing for $SERVICE'; exit 1; }

            _cnt=\$(yq '.countries.$COUNTRY' services/$SERVICE/service.yaml 2>/dev/null)
            if [ \"\$_cnt\" = 'null' ] || [ -z \"\$_cnt\" ]; then
              echo '  ERROR: Country $COUNTRY not in service.yaml for $SERVICE'
              exit 1
            fi

            # ── Save previous tag, write new tag ─────────────────────
            _prev=\$(yq '.tag' services/$SERVICE/service.yaml 2>/dev/null || echo '')
            if [ -n \"\$_prev\" ] && [ \"\$_prev\" != 'null' ]; then
              yq -i '.previous_tag = \"'\$_prev'\"' services/$SERVICE/service.yaml
            fi
            yq -i '.tag = \"$CI_COMMIT_TAG\"' services/$SERVICE/service.yaml
            echo \"  tag=$CI_COMMIT_TAG  →  services/$SERVICE/service.yaml\"

            # ── Deploy ───────────────────────────────────────────────
            CI=true ./deploy.sh $SERVICE --country $COUNTRY
          "
          EXIT=$?
          set -e

          if [ $EXIT -eq 0 ]; then
            echo "  ✔  OK: $SERVICE [$COUNTRY]"
          else
            echo "  ✖  FAILED: $SERVICE [$COUNTRY]  (exit $EXIT)"
            FAILED="$FAILED ${SERVICE}:${COUNTRY}"
          fi
        done
        echo ""
      done

      if [ -n "$FAILED" ]; then
        echo "  ✖  Failed:$FAILED"
        exit 1
      fi
      echo "  ✔  All deployed — Tag=$CI_COMMIT_TAG"
